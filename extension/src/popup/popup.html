<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>FlashBot</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <img src="../../icons/icon32.png" alt="" width="20" height="20" />
        <strong>FlashBot</strong>
      </div>
      <time class="faint" id="server-clock" title="Jam server Shopee">--:--:--</time>
      <button class="btn quiet sm icon-only" id="btn-settings" type="button" aria-label="Pengaturan" title="Pengaturan"><i data-icon="settings"></i></button>
    </header>

    <div id="main"></div>

    <section id="upcoming-wrap" hidden>
      <h2 class="label">Jadwal lain</h2>
      <div id="upcoming" class="rows"></div>
    </section>

    <section id="last-wrap" hidden>
      <h2 class="label">Hasil terakhir</h2>
      <div id="last" class="rows"></div>
    </section>

    <footer class="foot">
      <button class="btn primary" id="btn-add" type="button"><i data-icon="plus"></i>Tambah task</button>
      <button class="btn" id="btn-history" type="button"><i data-icon="history"></i>Riwayat</button>
    </footer>

    <script src="../lib/core.js"></script>
    <script src="../ui/icons.js"></script>
    <script src="../ui/ui.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
