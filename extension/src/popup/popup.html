<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>FlashBot Checkout</title>
    <link rel="stylesheet" href="../ui/theme.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <div class="brand">
        <img src="../../icons/icon32.png" alt="" width="22" height="22" />
        <strong>FlashBot</strong>
      </div>
      <button class="btn ghost sm" id="btn-settings" type="button" title="Pengaturan">Pengaturan</button>
    </header>

    <section id="active" class="list"></section>

    <section>
      <h2 class="label">Jadwal berikutnya</h2>
      <div id="upcoming" class="list"></div>
      <p id="upcoming-empty" class="muted small empty" hidden>Belum ada task terjadwal.</p>
    </section>

    <section id="last-wrap" hidden>
      <h2 class="label">Hasil terakhir</h2>
      <div id="last" class="list"></div>
    </section>

    <footer class="foot">
      <button class="btn primary" id="btn-add" type="button">+ Tambah task</button>
      <button class="btn" id="btn-history" type="button">Riwayat</button>
    </footer>

    <script src="../lib/core.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
